<!DOCTYPE html>
<html lang="ru">
<head>
   <meta charset="UTF-8">
   <title>Калькулятор</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="calculator">
      <h1>Калькулятор</h1>

      <div class="inputs">
         <input type="text" id="num1" placeholder="Первое число">
         <input type="text" id="num2" placeholder="Второе число">
      </div>

      <div class="buttons">
         <button id="btn-sum">сумма</button>
         <button id="btn-diff">разность</button>
         <button id="btn-mult">произведение</button>
         <button id="btn-div">деление</button>
      </div>

      <div id="result" class="result">Результат</div>
   </div>
   <script src="script.js"></script>
</body>
</html>
